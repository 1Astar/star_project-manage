<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户端更新胶囊｜交互原型 V1.1</title>
  <style>
    :root { --blue:#3D86F8; --ink:#031121; --muted:rgba(3,17,33,.68); --success:#079F4A; --danger:#E11D48; --card:#F2F9FE; --dialog:#E9F1F7; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; color:#fff; font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif; background:#88c9ee; }
    button { font:inherit; }
    .os-desktop { position:relative; width:100vw; height:100vh; min-width:900px; overflow:hidden; background:linear-gradient(126deg,#7285f2 0%,#328fe2 38%,#70cef4 72%,#b9e9f3 100%); }
    .os-desktop::before { content:""; position:absolute; width:70vw; height:120vh; right:-5vw; top:-35vh; border-radius:50%; background:radial-gradient(ellipse at 24% 60%,rgba(53,111,205,.9) 0%,rgba(68,177,239,.55) 35%,rgba(255,255,255,.03) 65%); transform:rotate(-18deg); }
    .os-desktop::after { content:"MINISFORUM"; position:absolute; z-index:0; right:35%; top:47%; color:rgba(255,255,255,.26); font-size:clamp(48px,6vw,98px); font-style:italic; font-weight:700; letter-spacing:-5px; transform:rotate(-5deg); }
    .os-topbar { position:absolute; z-index:2; inset:0 0 auto; height:54px; display:flex; align-items:center; justify-content:flex-end; gap:18px; padding:0 24px; background:rgba(255,255,255,.08); color:rgba(255,255,255,.95); font-size:12px; }
    .traffic-lights { position:absolute; left:22px; display:flex; gap:10px; }
    .traffic-lights i { display:block; width:18px; height:18px; border-radius:50%; }
    .traffic-lights i:nth-child(1) { background:#ff5f57; } .traffic-lights i:nth-child(2) { background:#febc2e; } .traffic-lights i:nth-child(3) { background:#28c840; }
    .top-stat { display:flex; align-items:center; gap:5px; opacity:.92; }
    .top-stat .signal { font-size:18px; }
    .top-stat strong { font-weight:600; }
    .desktop-apps { position:absolute; z-index:1; left:82px; top:75px; display:grid; grid-template-columns:repeat(3,112px); grid-auto-rows:128px; gap:0 50px; }
    .app-item { width:112px; border:0; background:transparent; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.24); cursor:pointer; }
    .app-icon { display:grid; place-items:center; width:66px; height:66px; margin:0 auto 10px; border-radius:17px; background:linear-gradient(145deg,#f9fcff,#7fc0f5); box-shadow:0 7px 16px rgba(30,77,158,.22),inset 0 0 0 1px rgba(255,255,255,.45); color:#214b72; font-size:31px; font-weight:700; }
    .app-icon.blue { background:linear-gradient(145deg,#8bd9ff,#1872eb); color:#fff; } .app-icon.purple { background:linear-gradient(145deg,#d7b0ff,#8e43ed); color:#fff; } .app-icon.orange { background:linear-gradient(145deg,#ffc95f,#ed7b24); color:#fff; } .app-icon.green { background:linear-gradient(145deg,#92e8b2,#19a86f); color:#fff; } .app-icon.dark { background:linear-gradient(145deg,#697887,#182633); color:#dfeeff; }
    .app-item span { display:block; font-size:15px; font-weight:500; }
    .status-capsule { position:absolute; z-index:4; top:74px; right:30px; display:none; align-items:center; min-height:44px; padding:0 8px 0 14px; border:1px solid rgba(255,255,255,.7); border-radius:10000px; background:rgba(255,255,255,.86); color:#1c3348; box-shadow:0 8px 40px rgba(0,0,0,.12); backdrop-filter:blur(16px); }
    .status-capsule.show { display:flex; }
    .capsule-open { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 8px 0 0; border:0; background:transparent; color:inherit; cursor:pointer; }
    .status-capsule .dot { width:8px; height:8px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 4px rgba(61,134,248,.12); }
    .status-capsule .capsule-text { font-size:14px; font-weight:500; white-space:nowrap; }
    .capsule-dismiss { width:28px; height:28px; border:0; border-radius:50%; background:transparent; color:#718193; font-size:20px; line-height:1; cursor:pointer; }
    .capsule-dismiss:hover { opacity:.7; }
    .capsule-open:focus-visible, .capsule-dismiss:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    .modal-layer { position:absolute; z-index:8; inset:54px 0 0; display:none; place-items:center; padding:30px; background:rgba(3,17,33,.14); backdrop-filter:blur(4px); }
    .modal-layer.show { display:grid; }
    .update-dialog { width:min(580px,calc(100vw - 50px)); overflow:hidden; border-radius:20px; background:rgba(244,250,255,.98); color:var(--ink); box-shadow:0 28px 70px rgba(2,20,35,.34); }
    .dialog-header { display:flex; align-items:center; justify-content:space-between; padding:21px 26px; border-bottom:1px solid #d9e3eb; font-size:19px; font-weight:650; }
    .dialog-close { width:28px; height:28px; border:0; background:transparent; color:#607181; font-size:25px; line-height:1; cursor:pointer; }
    .dialog-body { padding:24px 26px 20px; }
    .dialog-meta { display:flex; justify-content:space-between; gap:18px; margin-bottom:18px; color:#758697; font-size:12px; }
    .dialog-meta strong { color:#22384c; font-size:16px; }
    .dialog-status { display:flex; align-items:center; gap:10px; margin:2px 0 12px; font-size:24px; font-weight:700; }
    .dialog-status.available { color:var(--blue); } .dialog-status.success { color:var(--success); } .dialog-status.failure { color:var(--danger); }
    .dialog-copy { padding:15px 16px; border-radius:12px; background:#e8f2f9; color:#526779; font-size:13px; line-height:1.7; }
    .dialog-copy p { margin:0 0 11px; } .dialog-copy p:last-child { margin-bottom:0; }
    .update-progress { display:none; margin-top:16px; }
    .update-progress.show { display:block; }
    .progress-head { display:flex; justify-content:space-between; margin-bottom:7px; color:#526779; font-size:12px; }
    .progress-track { height:7px; overflow:hidden; border-radius:999px; background:#d9e7f0; }
    .progress-fill { display:block; width:0; height:100%; border-radius:999px; background:var(--blue); transition:width .22s ease; }
    .progress-fill.danger { background:var(--danger); }
    .dialog-foot { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:17px 26px 21px; border-top:1px solid #d9e3eb; }
    .dialog-foot.hidden { display:none; }
    .dialog-link { border:0; background:transparent; color:var(--blue); cursor:pointer; }
    .dialog-actions { display:flex; gap:10px; }
    #clientOther[hidden] + .dialog-actions,#osOther[hidden] + .dialog-actions { margin-left:auto; }
    .dialog-btn { min-width:92px; padding:10px 15px; border:1px solid #d4dee7; border-radius:10px; background:#fff; color:#3d5063; cursor:pointer; }
    .dialog-btn.hidden { display:none; }
    .dialog-btn.primary { border-color:#071b2e; background:#071b2e; color:#fff; }
    .dialog-btn.danger { border-color:var(--danger); background:var(--danger); color:#fff; }
    .toast { position:absolute; left:50%; bottom:30px; z-index:12; transform:translate(-50%,15px); padding:9px 15px; border-radius:9px; background:rgba(3,17,33,.84); color:#fff; font-size:13px; opacity:0; pointer-events:none; transition:.2s; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    .prototype-dock { position:absolute; z-index:20; left:50%; bottom:18px; display:flex; align-items:center; gap:6px; padding:7px; border:1px solid rgba(255,255,255,.4); border-radius:12px; background:rgba(3,17,33,.42); opacity:0; transform:translate(-50%,10px); transition:.2s; backdrop-filter:blur(12px); }
    .os-desktop:hover .prototype-dock { opacity:.96; transform:translate(-50%,0); }
    .prototype-dock span { padding:4px 7px; color:rgba(255,255,255,.68); font-size:11px; }
    .prototype-dock button { border:0; border-radius:7px; padding:6px 9px; background:rgba(255,255,255,.14); color:#fff; font-size:11px; cursor:pointer; }
    .prototype-dock button:hover,.prototype-dock button.active { background:var(--blue); }
    .prototype-dock select { height:29px; padding:0 22px 0 9px; border:1px solid rgba(255,255,255,.4); border-radius:8px; background:rgba(237,245,251,.20); color:#fff; font:11px "PingFang SC",sans-serif; cursor:pointer; }
    .prototype-dock select option { color:var(--ink); }
    .hidden-status-toggle { position:absolute; right:3px; bottom:3px; z-index:30; width:42px; height:42px; border:0; border-radius:50%; opacity:0; cursor:pointer; }
    @media (max-width:1100px) { .desktop-apps { left:42px; } .status-capsule { right:30px; } }
  </style>
</head>
<body>
  <main class="os-desktop" id="osDesktop">
    <header class="os-topbar">
      <div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="top-stat"><span class="signal">⌕</span><strong>52.71KB/s ↑</strong><span>215.93KB/s ↓</span></div>
      <div class="top-stat"><span>◎</span><strong>局域网</strong></div><div class="top-stat">▣</div><div class="top-stat">♧</div><div class="top-stat">●</div>
    </header>

    <section class="desktop-apps" aria-label="OS 主屏幕应用">
      <button class="app-item"><i class="app-icon blue">▰</i><span>文件管理</span></button>
      <button class="app-item"><i class="app-icon green">≡</i><span>任务中心</span></button>
      <button class="app-item"><i class="app-icon orange">＋</i><span>MinisLLM</span></button>
      <button class="app-item"><i class="app-icon orange">♞</i><span>MinisClaw</span></button>
      <button class="app-item"><i class="app-icon">⌑</i><span>回收站</span></button>
      <button class="app-item"><i class="app-icon orange">♟</i><span>通知消息</span></button>
      <button class="app-item"><i class="app-icon dark">▥</i><span>存储管理</span></button>
      <button class="app-item"><i class="app-icon purple">▶</i><span>智能相册</span></button>
      <button class="app-item"><i class="app-icon orange">＋</i><span>MinisLLM</span></button>
      <button class="app-item"><i class="app-icon dark">⚙</i><span>设置</span></button>
      <button class="app-item"><i class="app-icon purple">◉</i><span>影视</span></button>
      <button class="app-item"><i class="app-icon blue">◌</i><span>Minis媒体服务</span></button>
      <button class="app-item"><i class="app-icon dark">∿</i><span>设备监控</span></button>
      <button class="app-item"><i class="app-icon purple">♫</i><span>音乐</span></button>
      <button class="app-item"><i class="app-icon">qb</i><span>qBittorrent</span></button>
      <button class="app-item"><i class="app-icon blue">◫</i><span>局域网共享</span></button>
      <button class="app-item"><i class="app-icon blue">♨</i><span>Docker</span></button>
      <button class="app-item"><i class="app-icon green">▶</i><span>Emby</span></button>
      <button class="app-item"><i class="app-icon blue">☁</i><span>文件备份</span></button>
      <button class="app-item"><i class="app-icon green">▢</i><span>应用商店</span></button>
      <button class="app-item"><i class="app-icon dark">▶</i><span>Plex</span></button>
      <button class="app-item"><i class="app-icon green">↓</i><span>下载</span></button>
      <button class="app-item"><i class="app-icon purple">✥</i><span>MinisAibo</span></button>
      <button class="app-item"><i class="app-icon green">e</i><span>Calibre-Web</span></button>
    </section>

    <div class="status-capsule" id="clientCapsule" role="group" aria-label="客户端更新提醒"><button class="capsule-open" data-action="open-client" type="button"><i class="dot" aria-hidden="true"></i><span class="capsule-text">客户端有更新可用</span></button><button class="capsule-dismiss" data-action="dismiss-capsule" type="button" aria-label="关闭胶囊">×</button></div>

    <section class="modal-layer show" id="osLayer" aria-hidden="false">
      <article class="update-dialog" role="dialog" aria-modal="true" aria-labelledby="osTitle">
        <header class="dialog-header"><span id="osTitle">OS 更新</span><button class="dialog-close" data-action="close-os" type="button">×</button></header>
        <div class="dialog-body">
          <div class="dialog-meta"><strong>MiniS Cloud OS</strong><span>2.2.8　｜　237.18 MB</span></div>
          <div class="dialog-status available" id="osStatus">● 有新版本可用</div>
          <div class="dialog-copy" id="osCopy"><p>更新系统后可获得更稳定的设备服务和安全能力。</p><p>更新完成后设备可能需要重新启动。</p></div>
          <div class="update-progress" id="osProgress"><div class="progress-head"><span id="osProgressText">准备更新</span><span id="osProgressValue">0%</span></div><div class="progress-track"><i class="progress-fill" id="osProgressFill"></i></div></div>
        </div>
        <footer class="dialog-foot" id="osFooter"><button class="dialog-link" data-action="os-other" type="button" id="osOther">⌁ 手动下载其他版本</button><div class="dialog-actions"><button class="dialog-btn" data-action="ignore-os" type="button" id="osIgnore">忽略本次更新</button><button class="dialog-btn primary" data-action="install-os" type="button" id="osPrimary">立即更新</button></div></footer>
      </article>
    </section>

    <section class="modal-layer" id="clientLayer" aria-hidden="true">
      <article class="update-dialog" role="dialog" aria-modal="true" aria-labelledby="clientTitle">
        <header class="dialog-header"><span id="clientTitle">客户端更新</span><button class="dialog-close" data-action="close-client" type="button">×</button></header>
        <div class="dialog-body"><div class="dialog-meta"><strong>更新内容</strong><span>V2.1.1_25080　｜　211.73 MB</span></div><div class="dialog-copy"><p><b>· 智能相册</b><br>新增批量移出相册、批量删除照片、批量移入回收站。</p><p><b>· 外部存储</b><br>新增 GoogleDrive，修复 115 网盘展示。</p></div><div class="update-progress" id="clientProgress"><div class="progress-head"><span id="clientProgressText">准备更新</span><span id="clientProgressValue">0%</span></div><div class="progress-track"><i class="progress-fill" id="clientProgressFill"></i></div></div></div>
        <footer class="dialog-foot"><button class="dialog-link" data-action="client-other" type="button" id="clientOther">⌁ 手动下载其他版本</button><div class="dialog-actions"><button class="dialog-btn" data-action="ignore-client" type="button">忽略本次更新</button><button class="dialog-btn primary" data-action="update-client" type="button">立即更新</button></div></footer>
      </article>
    </section>

    <div class="toast" id="toast"></div>
    <div class="prototype-dock" aria-label="原型场景控制"><span>场景</span><button data-scenario="os">仅 OS</button><button data-scenario="client">仅客户端（含 OS 已最新）</button><button data-scenario="both" class="active">OS + 客户端</button><button data-scenario="none">无更新</button><span>OS 结果</span><button data-outcome="success" class="active">成功</button><button data-outcome="failure">失败</button><label for="clientPlatform"><span>客户端</span></label><select id="clientPlatform" aria-label="预览客户端类型"><option value="android">Android</option><option value="ios">iOS</option><option value="windows">Windows</option><option value="macos">macOS</option></select></div>
    <button class="hidden-status-toggle" data-action="toggle-outcome" type="button" aria-label="切换 OS 更新成功或失败"></button>
  </main>
  <script>
    const desktop = document.getElementById('osDesktop');
    const osLayer = document.getElementById('osLayer');
    const clientLayer = document.getElementById('clientLayer');
    const capsule = document.getElementById('clientCapsule');
    const osStatus = document.getElementById('osStatus');
    const osCopy = document.getElementById('osCopy');
    const osPrimary = document.getElementById('osPrimary');
    const osOther = document.getElementById('osOther');
    const osIgnore = document.getElementById('osIgnore');
    const osFooter = document.getElementById('osFooter');
    const osProgress = document.getElementById('osProgress');
    const osProgressText = document.getElementById('osProgressText');
    const osProgressValue = document.getElementById('osProgressValue');
    const osProgressFill = document.getElementById('osProgressFill');
    const clientOther = document.getElementById('clientOther');
    const clientPlatformSelect = document.getElementById('clientPlatform');
    const clientProgress = document.getElementById('clientProgress');
    const clientProgressText = document.getElementById('clientProgressText');
    const clientProgressValue = document.getElementById('clientProgressValue');
    const clientProgressFill = document.getElementById('clientProgressFill');
    const toast = document.getElementById('toast');
    let scenario = 'both';
    let outcome = 'success';
    let osFinished = false;
    let osUpdating = false;
    let clientUpdating = false;
    let osTimer = null;
    let clientTimer = null;
    const notify = text => { toast.textContent = text; toast.classList.add('show'); clearTimeout(notify.timer); notify.timer = setTimeout(() => toast.classList.remove('show'), 1500); };
    const showLayer = (layer, visible) => { layer.classList.toggle('show', visible); layer.setAttribute('aria-hidden', String(!visible)); };
    function setClientPlatform(next) {
      /* PRD：历史版本下载入口仅 Android 显示；iOS／Windows／macOS 隐藏且不留空位 */
      clientOther.hidden = next !== 'android';
      osOther.hidden = osFinished || next !== 'android';
      clientPlatformSelect.value = next;
    }
    const setProgress = (wrapper, text, valueEl, fill, percent, danger = false) => { wrapper.classList.add('show'); text.textContent = percent >= 100 ? '更新完成' : '正在更新'; valueEl.textContent = `${percent}%`; fill.style.width = `${percent}%`; fill.classList.toggle('danger', danger); };
    const resetProgress = (wrapper, text, value, fill) => { wrapper.classList.remove('show'); text.textContent = '准备更新'; value.textContent = '0%'; fill.style.width = '0%'; fill.classList.remove('danger'); };
    function updateOsResult() {
      osPrimary.disabled = false;
      osOther.disabled = false;
      osIgnore.disabled = false;
      osOther.hidden = osFinished || clientPlatformSelect.value !== 'android';
      osIgnore.hidden = osFinished;
      if (!osFinished) {
        osFooter.classList.remove('hidden');
        osStatus.className = 'dialog-status available'; osStatus.textContent = '● 有新版本可用';
        osCopy.innerHTML = '<p>更新系统后可获得更稳定的设备服务和安全能力。</p><p>更新完成后设备可能需要重新启动。</p>';
        osPrimary.textContent = '立即更新';
        osPrimary.classList.remove('danger'); osPrimary.classList.add('primary');
        resetProgress(osProgress, osProgressText, osProgressValue, osProgressFill);
        return;
      }
      const failed = outcome === 'failure';
      osFooter.classList.toggle('hidden', failed);
      osStatus.className = `dialog-status ${failed ? 'failure' : 'success'}`;
      osStatus.textContent = failed ? '！更新失败' : '✓ 更新成功';
      osCopy.innerHTML = failed ? '<p>OS 更新未完成，请检查网络连接后重试。</p>' : '<p>OS 已更新到最新版本。</p><p>客户端已恢复可用。</p>';
      osPrimary.textContent = '返回主界面';
      osPrimary.classList.add('primary');
      resetProgress(osProgress, osProgressText, osProgressValue, osProgressFill);
    }
    function showOs() { showLayer(clientLayer, false); showLayer(osLayer, true); updateOsResult(); }
    function showClient() { showLayer(osLayer, false); showLayer(clientLayer, true); }
    function finishOs() {
      if (osUpdating) return;
      osUpdating = true; osPrimary.disabled = true; osOther.disabled = true; osIgnore.disabled = true; osProgress.classList.add('show');
      let value = 0; clearInterval(osTimer);
      osTimer = setInterval(() => {
        value += outcome === 'failure' ? 18 : 14;
        setProgress(osProgress, osProgressText, osProgressValue, osProgressFill, Math.min(value, 100), outcome === 'failure');
        if (outcome === 'failure' && value >= 72) {
          clearInterval(osTimer); osUpdating = false; osPrimary.disabled = false; osFinished = true; resetProgress(osProgress, osProgressText, osProgressValue, osProgressFill); updateOsResult();
        } else if (value >= 100) {
          clearInterval(osTimer); osUpdating = false; osPrimary.disabled = false; osFinished = true; setProgress(osProgress, osProgressText, osProgressValue, osProgressFill, 100); updateOsResult();
        }
      }, 220);
    }
    function startClientUpdate() {
      if (clientUpdating) return;
      clientUpdating = true; clientProgress.classList.add('show');
      let value = 0; clearInterval(clientTimer);
      clientTimer = setInterval(() => {
        value = Math.min(value + 16, 100);
        setProgress(clientProgress, clientProgressText, clientProgressValue, clientProgressFill, value);
        if (value >= 100) { clearInterval(clientTimer); clientUpdating = false; notify('客户端更新完成'); }
      }, 220);
    }
    function leaveOs() { showLayer(osLayer, false); if (scenario === 'both') capsule.classList.add('show'); }
    function applyScenario(next) {
      scenario = next; osFinished = false; osUpdating = false; clientUpdating = false; clearInterval(osTimer); clearInterval(clientTimer); resetProgress(osProgress, osProgressText, osProgressValue, osProgressFill); resetProgress(clientProgress, clientProgressText, clientProgressValue, clientProgressFill); capsule.classList.remove('show'); showLayer(clientLayer, false);
      document.querySelectorAll('[data-scenario]').forEach(button => button.classList.toggle('active', button.dataset.scenario === scenario));
      if (scenario === 'none') { showLayer(osLayer, false); return; }
      if (scenario === 'client' || scenario === 'os-latest') { showClient(); return; }
      showOs();
    }
    function applyOutcome(next) {
      outcome = next;
      document.querySelectorAll('[data-outcome]').forEach(button => button.classList.toggle('active', button.dataset.outcome === outcome));
      if (osFinished) updateOsResult();
    }
    desktop.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      const action = target?.dataset.action;
      if (!action) return;
      if (action === 'install-os') { if (!osFinished) finishOs(); else leaveOs(); return; }
      if (action === 'close-os') { leaveOs(); return; }
      if (action === 'ignore-os') { leaveOs(); return; }
      if (action === 'os-other') { if (!osOther.hidden) notify('已进入其他版本下载'); return; }
      if (action === 'open-client') { showClient(); return; }
      if (action === 'close-client' || action === 'ignore-client') { showLayer(clientLayer, false); return; }
      if (action === 'update-client') { startClientUpdate(); return; }
      if (action === 'client-other') { if (!clientOther.hidden) notify('已进入其他版本下载'); return; }
      if (action === 'dismiss-capsule') { event.stopPropagation(); capsule.classList.remove('show'); return; }
      if (action === 'toggle-outcome') { applyOutcome(outcome === 'success' ? 'failure' : 'success'); notify(outcome === 'success' ? 'OS 更新结果：成功' : 'OS 更新结果：失败'); }
    });
    desktop.addEventListener('click', event => { const scenarioButton = event.target.closest('[data-scenario]'); if (scenarioButton) applyScenario(scenarioButton.dataset.scenario); const outcomeButton = event.target.closest('[data-outcome]'); if (outcomeButton) applyOutcome(outcomeButton.dataset.outcome); });
    clientPlatformSelect.addEventListener('change', event => setClientPlatform(event.target.value));
    setClientPlatform('android');
    updateOsResult();
  </script>
</body>
</html>
